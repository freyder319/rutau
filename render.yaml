# Despliegue en Render (https://render.com) con "Blueprint": New + → Blueprint → elegir este repositorio.
services:
  - type: web
    name: rutau
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TZ
        value: America/Bogota
      - key: DATABASE_URL
        fromDatabase:
          name: rutau-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: rutau-db
    plan: free
    databaseName: rutau
    user: rutau
